<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Username Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-section">
                <svg class="discord-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.211.375-.445.865-.607 1.25a18.27 18.27 0 0 0-5.487 0c-.162-.39-.396-.875-.607-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.975 14.975 0 0 0 1.293-2.1a.07.07 0 0 0-.038-.098a13.11 13.11 0 0 1-1.872-.892a.072.072 0 0 1-.007-.12a10.149 10.149 0 0 0 .372-.294a.07.07 0 0 1 .073-.01c3.928 1.793 8.18 1.793 12.062 0a.07.07 0 0 1 .074.009c.12.098.246.199.372.294a.072.072 0 0 1-.006.12a12.296 12.296 0 0 1-1.873.892a.077.077 0 0 0-.037.099a14.97 14.97 0 0 0 1.293 2.1a.076.076 0 0 0 .084.028a19.863 19.863 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.057c.5-4.565-.838-8.526-3.54-12.46a.06.06 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-.965-2.157-2.156c0-1.193.946-2.157 2.157-2.157c1.211 0 2.176.964 2.157 2.157c0 1.19-.946 2.156-2.157 2.156zm7.975 0c-1.183 0-2.157-.965-2.157-2.156c0-1.193.946-2.157 2.157-2.157c1.211 0 2.176.964 2.157 2.157c0 1.19-.946 2.156-2.157 2.156z"/>
                </svg>
                <h1 class="title">Discord Username Checker</h1>
            </div>
            <div class="header-actions">
                <button class="btn-login">LOGIN</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Configuration Section -->
            <section class="section config-section">
                <h2 class="section-title">Configuration</h2>
                <div class="config-box">
                    <label for="webhook">Discord Webhook URL (Optional):</label>
                    <input type="text" id="webhook" placeholder="https://discord.com/api/webhooks/..." class="input-field">
                    <button class="btn-save">SAVE</button>
                </div>
            </section>

            <!-- Available Usernames Grid -->
            <section class="section usernames-section">
                <h2 class="section-title">Available Usernames</h2>
                <div class="usernames-grid">
                    <div class="username-item status-available">
                        <span class="username-text">Semi 2L</span>
                    </div>
                    <div class="username-item status-available">
                        <span class="username-text">Semi 3C</span>
                    </div>
                    <div class="username-item status-available">
                        <span class="username-text">Bad 235</span>
                    </div>
                    <div class="username-item status-available">
                        <span class="username-text">Bad 53C</span>
                    </div>
                    <div class="username-item status-available">
                        <span class="username-text">xxx</span>
                    </div>
                    <div class="username-item status-available">
                        <span class="username-text">xxx.</span>
                    </div>
                    <div class="username-item status-available">
                        <span class="username-text">4L</span>
                    </div>
                    <div class="username-item status-available">
                        <span class="username-text">5C</span>
                    </div>
                    <div class="username-item status-available">
                        <span class="username-text">Letter Rep</span>
                    </div>
                    <div class="username-item status-available">
                        <span class="username-text">Digit Rep</span>
                    </div>
                    <div class="username-item status-available">
                        <span class="username-text">Semi 5M</span>
                    </div>
                    <div class="username-item status-available">
                        <span class="username-text">Via T3T</span>
                    </div>
                </div>
            </section>

            <!-- Check Control Section -->
            <section class="section control-section">
                <div class="control-container">
                    <div class="starting-letter">
                        <label for="startLetter">Starting Letter:</label>
                        <select id="startLetter" class="select-field">
                            <option value="">All Letters</option>
                            <option value="a">A</option>
                            <option value="b">B</option>
                            <option value="c">C</option>
                            <option value="d">D</option>
                            <option value="e">E</option>
                            <option value="f">F</option>
                            <option value="g">G</option>
                            <option value="h">H</option>
                            <option value="i">I</option>
                            <option value="j">J</option>
                            <option value="k">K</option>
                            <option value="l">L</option>
                            <option value="m">M</option>
                            <option value="n">N</option>
                            <option value="o">O</option>
                            <option value="p">P</option>
                            <option value="q">Q</option>
                            <option value="r">R</option>
                            <option value="s">S</option>
                            <option value="t">T</option>
                            <option value="u">U</option>
                            <option value="v">V</option>
                            <option value="w">W</option>
                            <option value="x">X</option>
                            <option value="y">Y</option>
                            <option value="z">Z</option>
                        </select>
                    </div>
                    <button class="btn-start" id="startBtn">START CHECKING</button>
                </div>
            </section>

            <!-- Statistics Section -->
            <section class="section stats-section">
                <h2 class="section-title">Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="checkedCount">0</div>
                        <div class="stat-label">Checked</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number stat-available" id="availableCount">0</div>
                        <div class="stat-label">Available</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number stat-taken" id="takenCount">0</div>
                        <div class="stat-label">Taken</div>
                    </div>
                </div>
                <div class="availability-percentage">
                    <span id="percentage">0%</span>
                </div>
            </section>

            <!-- Available Usernames Results -->
            <section class="section results-section">
                <h2 class="section-title">Available Usernames Results</h2>
                <div class="results-placeholder" id="resultsPlaceholder">
                    NO RESULTS YET
                </div>
                <div class="results-list" id="resultsList"></div>
            </section>
        </main>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="live-checking">
                <h3 class="sidebar-title">LIVE CHECKING</h3>
                <div class="checking-status" id="checkingStatus">Idle</div>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
